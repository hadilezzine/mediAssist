<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - MediAssist</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #582ea2;
      --primary-light: #66626f;
      --primary-soft: #C4B5FD;
      --white: #FFFFFF;
      --light-bg: #F8FAFC;
      --dark-text: #1E293B;
      --gray-text: #64748B;
      --border: #E2E8F0;
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    .background-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    .register-container {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .register-card {
      display: flex;
      max-width: 750px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      background: var(--card-bg);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .welcome-section {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--white);
      padding: 2rem 1.5rem;
      width: 40%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .welcome-section h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .welcome-section p {
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.9);
      line-height: 1.5;
    }

    .welcome-section .register-btn {
      text-decoration: none;
      background-color: var(--white);
      color: var(--primary);
      padding: 0.6rem 1.5rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    }

    .register-section {
      width: 60%;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .register-section h2 {
      font-size: 1.5rem;
      margin-bottom: 1.2rem;
      color: var(--primary);
      font-weight: 600;
      text-align: center;
    }

    .register-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--gray-text);
      font-weight: 500;
    }

    .input-group input {
      padding: 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      background-color: rgba(255,255,255,0.8);
    }

    .register-button {
      padding: 0.7rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--white);
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 3px 10px rgba(124, 58, 237, 0.2);
    }

    .login-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8rem;
    }

    @media (max-width: 768px) {
      .register-card {
        flex-direction: column;
        max-width: 90%;
      }

      .welcome-section, .register-section {
        width: 100%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <iframe src="index.html" class="background-frame"></iframe>

  <div class="register-container">
    <div class="register-card">
      <div class="welcome-section">
        <h2>Bienvenue !</h2>
        <p>Déjà membre ? Connectez-vous ici</p>
        <a href="login.html" class="register-btn">
          <i class="fas fa-sign-in-alt"></i> Connexion
        </a>
      </div>
      
      <div class="register-section">
        <h2>Créer un compte</h2>
        <form class="register-form" action="register.php" method="POST">
          <div class="input-group">
            <label for="prenom">Prénom</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>
          </div>
          
          <div class="input-group">
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>
          </div>
          
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required>
          </div>
          
          <div class="input-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="mot_de_passe" placeholder="••••••••" required>
          </div>

          <div class="input-group">
            <label for="confirmation">Confirmer le mot de passe</label>
            <input type="password" id="confirmation" name="confirmation" placeholder="••••••••" required>
          </div>
          
          <button type="submit" class="register-button">
            <i class="fas fa-user-plus"></i> S'inscrire
          </button>
          
          <div class="login-link">
            <p>Déjà un compte ? <a href="login.html">Se connecter</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
