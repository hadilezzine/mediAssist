<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediAssist - Accueil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary: #7C3AED;
      --primary-light: #8B5CF6;
      --primary-dark: #6D28D9;
      --secondary: #A78BFA;
      --dark: #0F172A;
      --darker: #0a1548;
      --light: #E2E8F0;
      --gray: #64748B;
      --background: linear-gradient(135deg, #4b3f5a 0%, #1E293B 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--background);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      padding:0.2rem 0%;
      background-color: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(74, 64, 91, 0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.01rem;
    }

    header img {
  height: 80px;
  width: 200px
 
  
}



    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 1px 0;
    }

    main {
      flex: 1;
      padding: 4rem 5%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      max-width: 1200px;
      border-radius: 24px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3),
                  0 0 0 1px rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.1);
    }

    .hero-image {
      flex: 1;
      min-width: 300px;
      position: relative;
    }

    .hero-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, rgba(124, 58, 237, 0.3), transparent);
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      flex: 1;
      min-width: 300px;
      padding: 3rem;
    }

    .hero-content h2 {
      font-size: 2.5rem;
      margin-bottom: 1.5rem;
      color: white;
      font-weight: 700;
      line-height: 1.2;
    }

    .hero-content p {
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      color: var(--gray);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.875rem 1.75rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4),
                  0 0 0 1px rgba(255,255,255,0.05);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-light), var(--primary));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5),
                  0 0 0 1px rgba(255,255,255,0.1);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.05);
      color: var(--light);
      border: 1px solid rgba(124, 58, 237, 0.3);
      backdrop-filter: blur(5px);
    }

    .btn-secondary:hover {
      background: rgba(124, 58, 237, 0.1);
      transform: translateY(-2px);
      border: 1px solid rgba(124, 58, 237, 0.5);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      color: var(--gray);
      background-color: rgba(2, 6, 23, 0.7);
      border-top: 1px solid rgba(124, 58, 237, 0.1);
    }

    @media (max-width: 768px) {
      .hero {
        flex-direction: column;
      }
      
      .hero-content {
        padding: 2rem;
      }
      
      .hero-content h2 {
        font-size: 2rem;
      }
      
      .buttons {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="https://play-lh.googleusercontent.com/zNvC2BHQccGsQYCxm2EBa74SO47g8lHZQNf20KFEIIiF8jPDHfhzS5mAoD8tEMrB274=w600-h300-pc0xffffff-pd" alt="Logo" />
      <h1>MediAssist</h1>
    </div>
  </header>

  <main>
    <div class="hero">
      <div class="hero-image">
        <img src="https://png.pngtree.com/png-vector/20230728/ourmid/pngtree-alzheimer-s-clipart-an-illustration-of-an-old-man-puzzler-with-vector-png-image_6795469.png" alt="Hero Image">
      </div>
      
      <div class="hero-content">
        <h2>Bienvenu sur MediAssist </h2>
        <p>
          Une plateforme élégante pour gérer vos médicaments, rendez-vous et ordonnances. 
          Restez organisé avec notre interface futuriste et intuitive.
        </p>
        <div class="buttons">
          <button class="btn btn-primary" onclick="window.location.href='login.html'">
            <i class="fas fa-sign-in-alt"></i> Connexion
          </button>
          <button class="btn btn-secondary" onclick="window.location.href='register.html'">
            <i class="fas fa-user-plus"></i> Inscription
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 MediAssist. Tous droits réservés.
  </footer>
</body>
</html>
